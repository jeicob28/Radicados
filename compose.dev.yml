# Overlay de desarrollo: puertos expuestos + hot-reload por bind-mount.
# Uso:  docker compose -f compose.yml -f compose.dev.yml up --build
#   ó:  npm run up:dev

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web

  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
    ports:
      - "${API_PORT:-3000}:3000"

  worker:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/worker/src:/app/src

  web:
    build:
      target: dev
    environment:
      VITE_API_PROXY: http://api:3000
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/index.html:/app/index.html
    ports:
      - "5173:5173"

  proxy:
    environment:
      WEB_UPSTREAM: web:5173
