# Overlay de producción.
# Uso:  docker compose -f compose.yml -f compose.prod.yml up -d --build
#   ó:  npm run up:prod
#
# Antes de usar en un entorno real:
#  - Definir secretos fuertes en .env (JWT_*, INTERNAL_TOKEN, AUDIT_EXPORT_SECRET, contraseñas).
#  - Terminar TLS en el proxy o delante de él.
#  - Las copias de seguridad quedan activas solas con el servicio `backup`
#    (cron diario 02:00 → ./backups/). Ver docs/backups.md.

services:
  postgres:
    restart: always
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    restart: always
    mem_limit: 192m

  minio:
    restart: always
    mem_limit: 512m

  api:
    restart: always
    mem_limit: 640m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # El panel "Copias de seguridad" muestra esta configuración y avisa si las
    # copias están cifradas antes de restaurar.
    environment:
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-1500}
      BACKUP_ENC_PASSPHRASE: ${BACKUP_ENC_PASSPHRASE:-}
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}

  worker:
    restart: always
    mem_limit: 320m

  web:
    restart: always
    mem_limit: 64m

  proxy:
    restart: always
    mem_limit: 64m

  # ── Copias de seguridad ──────────────────────────────────────────────────
  # Cron interno: cada día a las 02:00 (BACKUP_CRON) hace pg_dump + espejo de
  # MinIO + config, con manifiesto, checksums y retención. Habla con postgres
  # y minio por la red de Docker (no usa el socket de Docker). Los archivos
  # quedan en ./backups/ del propio servidor.
  # Además atiende (watcher) las peticiones de copia/restauración que el ADMIN
  # lanza desde el panel (Administración › Copias de seguridad), por una cola
  # de archivos en ./backups/.control/ compartida con la API.
  # Restaurar/verificar por consola: infra/backup/restaurar.sh y verificar.sh.
  # Ver docs/backups.md.
  backup:
    build:
      context: ./infra/backup
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radicados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radicados_dev}
      POSTGRES_DB: ${POSTGRES_DB:-radicados}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-radicados}
      TZ: ${TZ:-America/Bogota}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-1500}
      BACKUP_ON_START: ${BACKUP_ON_START:-0}
      BACKUP_CONFIG_DIR: /proyecto
      BACKUP_ENC_PASSPHRASE: ${BACKUP_ENC_PASSPHRASE:-}
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
      BACKUP_NOTIFY_URL: ${BACKUP_NOTIFY_URL:-}
    volumes:
      - ./backups:/backups
      - ./.env:/proyecto/.env:ro
      - ./compose.yml:/proyecto/compose.yml:ro
      - ./compose.prod.yml:/proyecto/compose.prod.yml:ro
    depends_on:
      - postgres
      - minio
